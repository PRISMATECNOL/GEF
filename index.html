<!DOCTYPE html>
<html lang="pt-MZ">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>GEF Gestão Financeira ERP</title>
  <meta name="description" content="Gestão completa do seu negócio.">
  <meta property="og:title" content="GEF Gestão Financeira ERP">
  <meta property="og:description" content="Gestão completa do seu negócio.">
  <link rel="icon" type="image/svg+xml" href="assets/icons/icon.svg">
  <!-- PWA: o <link rel="manifest"> NÃO está aqui de propósito. js/core/app-identity.js injecta-o só depois de login válido
       (manifesto personalizado da loja ou, sem identidade, manifest.webmanifest). Assim não há instalação antes de autenticar. -->
  <meta name="theme-color" content="#020617">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="GEF">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  
  <!-- Estilos Puros (CSS) -->
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <style>
    /* Abertura GEF + PRISMA: aparece já no 1.º frame e sai quando a aplicação desenha o ecrã (ver script no fim) */
    #gef-boot{position:fixed;inset:0;z-index:10000;display:flex;flex-direction:column;align-items:center;justify-content:center;
      background:radial-gradient(120% 90% at 50% 38%,#0f172a 0%,#020617 62%);color:#e2e8f0;transition:opacity .45s ease;
      padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
    #gef-boot.out{opacity:0;pointer-events:none}
    #gef-boot .logo{width:min(46vw,176px);height:auto;filter:drop-shadow(0 10px 34px rgba(249,115,22,.30));animation:gefIn .8s ease both}
    #gef-boot .fin{margin-top:18px;font:700 11px/1 system-ui,-apple-system,sans-serif;letter-spacing:.34em;color:#f59e0b;text-transform:uppercase;padding-left:.34em}
    #gef-boot .tag{margin-top:20px;font:400 13px/1.4 system-ui,-apple-system,sans-serif;color:#94a3b8}
    #gef-boot .dots{margin-top:26px;display:flex;gap:7px}
    #gef-boot .dots i{width:6px;height:6px;border-radius:50%;background:#f97316;opacity:.25;animation:gefDot 1.1s infinite ease-in-out}
    #gef-boot .dots i:nth-child(2){animation-delay:.18s}#gef-boot .dots i:nth-child(3){animation-delay:.36s}
    #gef-boot .by{position:absolute;left:0;right:0;bottom:calc(34px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:9px}
    #gef-boot .by .ln{width:56px;height:1px;background:linear-gradient(90deg,transparent,#475569,transparent)}
    #gef-boot .by small{font:600 9px/1 system-ui,-apple-system,sans-serif;letter-spacing:.38em;text-transform:uppercase;color:#64748b;padding-left:.38em}
    #gef-boot .by div{display:flex;align-items:center;gap:10px}
    #gef-boot .by b{font:300 20px/1 Georgia,'Times New Roman',serif;letter-spacing:.42em;color:#e2e8f0;padding-left:.42em}
    @keyframes gefIn{from{opacity:0;transform:translateY(8px) scale(.96)}to{opacity:1;transform:none}}
    @keyframes gefDot{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}
    @media (prefers-reduced-motion:reduce){#gef-boot .logo,#gef-boot .dots i{animation:none}}
  </style>
</head>
<body>
  <!-- Abertura / processamento: logótipo GEF em destaque; PRISMA (empresa criadora) por baixo -->
  <div id="gef-boot" role="status" aria-label="A abrir GEF">
    <img class="logo" src="assets/icons/icon.svg" alt="GEF">
    <div class="tag">Gestão completa do seu negócio</div>
    <div class="dots" aria-hidden="true"><i></i><i></i><i></i></div>
    <div class="by">
      <span class="ln"></span><small>Criado por</small>
      <div>
        <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><defs><linearGradient id="bootSp" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f97316"/><stop offset=".5" stop-color="#facc15"/><stop offset="1" stop-color="#38bdf8"/></linearGradient></defs><path d="M12 2.5 22 20H2z" fill="none" stroke="#e2e8f0" stroke-width="1.4" stroke-linejoin="round"/><path d="M7.5 14.5 16.5 11" stroke="#f8fafc" stroke-width="1" stroke-linecap="round"/><path d="M16.5 11 22 9.5M16.5 11l5.5 1.5M16.5 11l5 4" stroke="url(#bootSp)" stroke-width="1.3" stroke-linecap="round"/></svg>
        <b>PRISMA</b>
      </div>
    </div>
  </div>

  <!-- Cabeçalho / Navbar Global -->
  <div id="navbar-root"></div>

  <!-- Layout Principal com Sidebar e Conteúdo -->
  <div class="app-layout">
    <div id="sidebar-root"></div>

    <main class="main-content" id="main-content-root">
      <!-- Banner de Alerta / Trava SaaS (se vencido) -->
      <div id="lock-banner-root"></div>

      <!-- Container Dinâmico do Módulo Ativo -->
      <div id="module-container"></div>
    </main>
  </div>

  <!-- Script Principal Vanilla JavaScript (ES Module) -->
  <script type="module" src="js/native-bridge.js"></script>
  <script type="module" src="js/app.js"></script>
  <script type="module" src="js/pwa.js"></script>
  <script>
    /* Fecha a abertura quando a aplicação já desenhou conteúdo (mín. 1,1 s para não piscar; máx. 8 s de segurança). */
    (function () {
      var boot = document.getElementById('gef-boot'); if (!boot) return;
      var t0 = Date.now(), done = false;
      function hide() { if (done) return; done = true; boot.classList.add('out'); setTimeout(function () { boot.remove(); }, 600); }
      function ready() { setTimeout(hide, Math.max(0, 1100 - (Date.now() - t0))); }
      var mc = document.getElementById('module-container');
      if (mc) {
        if (mc.children.length) ready();
        else new MutationObserver(function (m, o) { if (mc.children.length) { o.disconnect(); ready(); } }).observe(mc, { childList: true });
      }
      setTimeout(hide, 8000);
    })();
  </script>
</body>
</html>
