<!DOCTYPE html>
<html lang="pt-MZ">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#020617">
  <title>Sem ligação | GEF</title>
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #020617; color: #e2e8f0; font-family: system-ui, sans-serif; text-align: center; padding: 24px; }
    .box { max-width: 420px; }
    h1 { font-size: 20px; margin: 0 0 8px; }
    p { font-size: 14px; color: #94a3b8; line-height: 1.5; }
    button { margin-top: 16px; padding: 10px 18px; border: 0; border-radius: 8px; background: #ea580c; color: #fff; font-weight: 700; cursor: pointer; }
  </style>
</head>
<body>
  <div class="box">
    <h1>Sem ligação à internet</h1>
    <p>O GEF precisa de ligação para ler e gravar os dados da loja com segurança. Verifique a rede e tente novamente.</p>
    <button onclick="location.reload()">Tentar novamente</button>
  </div>
</body>
</html>
